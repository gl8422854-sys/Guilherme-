<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atari 2600 Space Invaders Arcade</title>
  
  <meta name="theme-color" content="#2c1810">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Configuração do PWA (Bandeja de Apps) -->
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0b0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    /* Gabinete do Arcade */
    .cabinet {
      position: relative;
      background: linear-gradient(135deg, #3d2314 0%, #1f110a 100%);
      border: 8px solid #111;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.9);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
    }

    /* Marquee */
    .marquee {
      background: #000;
      border: 3px solid #ffcc00;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      width: 100%;
      user-select: none;
      box-shadow: 0 0 10px rgba(255,204,0,0.4);
    }
    .marquee h1 {
      font-size: 20px;
      color: #ff3333;
      text-shadow: 2px 2px #ffcc00;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Tela CRT */
    .crt-screen-container {
      position: relative;
      margin: 15px 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 6px solid #222;
      box-shadow: inset 0 0 20px rgba(0,255,0,0.2);
    }
    canvas { display: block; background: #050508; }
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    /* Controles */
    .control-panel {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 10px 5px;
      background: #180e0a;
      border-radius: 8px;
      border: 2px solid #331c12;
    }
    .d-pad, .action-pad { display: flex; gap: 10px; }
    .arcade-btn {
      background: #a62b2b;
      color: white;
      border: 2px solid #ff6666;
      border-radius: 50%;
      width: 50px; height: 50px;
      font-size: 18px; font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px #521515;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .arcade-btn:active { transform: translateY(3px); box-shadow: 0 1px #521515; }
    .fire-btn {
      background: #e6b800; border: 2px solid #ffff66;
      box-shadow: 0 4px #7a6200; color: #000;
      border-radius: 8px; width: 70px; height: 50px;
    }
    .fire-btn:active { transform: translateY(3px); box-shadow: 0 1px #7a6200; }

    /* Barra Inferior com Botão Centralizado */
    .cabinet-footer {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 12px;
      align-items: center;
    }
    .exit-btn {
      background: #a62b2b;
      color: #fff;
      border: 2px solid #ff6666;
      padding: 8px 24px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      letter-spacing: 1px;
      box-shadow: 0 4px #521515;
      font-family: 'Courier New', Courier, monospace;
    }

    /* --- GALERIA/COFRE ESTILO GOOGLE FOTOS --- */
    #vaultApp {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #121212; z-index: 1000;
      flex-direction: column;
    }

    /* Top Bar Google Fotos */
    .photos-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #1f1f1f; color: #fff;
    }
    .backup-badge {
      display: flex; align-items: center; gap: 6px; background: #2d2d2d;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .backup-badge::before { content: '☁️'; font-size: 14px; }
    .profile-icon {
      width: 32px; height: 32px; background: #6200ee; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
    }

    /* Área Central de Conteúdo */
    .photos-content {
      flex: 1; overflow-y: auto; padding: 4px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .folder-picker-card {
      background: #1e1e24; border-radius: 12px; padding: 16px; margin: 8px;
      text-align: center; border: 1px solid #333;
    }
    .select-folder-btn {
      background: #a8c7fa; color: #042e6f; border: none;
      padding: 10px 20px; border-radius: 20px; font-weight: 600;
      cursor: pointer; font-size: 13px; margin-top: 10px;
    }

    /* Grelha de Mídias */
    .gallery-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    }
    .media-card {
      position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000;
      overflow: hidden;
    }
    .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; }
    .delete-media {
      position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6);
      color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px;
      font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Floating / Navigation Bottom Bar */
    .photos-bottombar {
      display: flex; justify-content: space-around; align-items: center;
      background: #1f1f1f; padding: 8px 16px; border-top: 1px solid #2d2d2d;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #c4c7c5; font-size: 11px; background: none; border: none; cursor: pointer;
    }
    .nav-item.active { color: #a8c7fa; font-weight: 600; }
    .nav-icon { font-size: 18px; }

    /* Lightbox */
    #lightboxModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 2000; align-items: center; justify-content: center;
      flex-direction: column;
    }
    #lightboxContainer { display: flex; align-items: center; justify-content: center; width: 100%; height: 85%; }
    .close-lightbox { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="cabinet">
    <div class="marquee">
      <h1>SPACE INVADERS</h1>
    </div>

    <div class="crt-screen-container">
      <div class="crt-overlay"></div>
      <canvas id="gameCanvas" width="320" height="380"></canvas>
    </div>

    <div class="control-panel">
      <div class="d-pad">
        <button class="arcade-btn" id="leftBtn">&larr;</button>
        <button class="arcade-btn" id="rightBtn">&rarr;</button>
      </div>
      <div class="action-pad">
        <button class="arcade-btn fire-btn" id="fireBtn">FIRE</button>
      </div>
    </div>

    <div class="cabinet-footer">
      <button class="exit-btn" id="secretExitBtn">SAIR</button>
    </div>
  </div>

  <!-- App Galeria Estilo Google Fotos -->
  <div id="vaultApp">
    <div class="photos-topbar">
      <div class="backup-badge" id="folderStatus">Backup concluído</div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button id="closeVaultAppBtn" style="background:none; border:none; color:#a8c7fa; font-size:12px; font-weight:bold; cursor:pointer;">Voltar ao Jogo</button>
        <div class="profile-icon">G</div>
      </div>
    </div>

    <div class="photos-content">
      <div class="folder-picker-card">
        <p style="font-size: 13px; color: #e3e2e6;">Vincular pasta do dispositivo para backup local</p>
        <button class="select-folder-btn" id="selectFolderBtn">Escolher Pasta do Dispositivo</button>
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none;" />
      </div>

      <div id="gallery" class="gallery-grid"></div>
    </div>

    <div class="photos-bottombar">
      <button class="nav-item active">
        <span class="nav-icon">🖼️</span>
        <span>Fotos</span>
      </button>
      <button class="nav-item" id="addMediaBtn">
        <span class="nav-icon">➕</span>
        <span>Adicionar</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">📁</span>
        <span>Álbuns</span>
      </button>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightboxModal">
    <button class="close-lightbox" id="closeLightboxBtn">Fechar</button>
    <div id="lightboxContainer"></div>
  </div>

  <script>
    // --- REGISTRO DO SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker ativo!', reg))
          .catch(err => console.log('Erro SW:', err));
      });
    }

    let directoryHandle = null;
    const folderStatus = document.getElementById('folderStatus');
    const selectFolderBtn = document.getElementById('selectFolderBtn');
    const mediaInput = document.getElementById('mediaInput');
    const gallery = document.getElementById('gallery');
    const addMediaBtn = document.getElementById('addMediaBtn');

    selectFolderBtn.addEventListener('click', async () => {
      try {
        directoryHandle = await window.showDirectoryPicker();
        folderStatus.innerText = `Pasta Conectada`;
        selectFolderBtn.innerText = "Sincronizar Outra Pasta";
        loadDeviceFolderFiles();
      } catch (err) {
        console.log('Acesso cancelado', err);
      }
    });

    addMediaBtn.addEventListener('click', () => {
      if (!directoryHandle) {
        alert('Por favor, vincule uma pasta primeiro clicando em "Escolher Pasta do Dispositivo"');
      } else {
        mediaInput.click();
      }
    });

    async function loadDeviceFolderFiles() {
      if (!directoryHandle) return;
      gallery.innerHTML = '';
      
      for await (const [name, handle] of directoryHandle.entries()) {
        if (handle.kind === 'file') {
          const file = await handle.getFile();
          if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
            const url = URL.createObjectURL(file);
            renderMediaCard(url, file.type, name);
          }
        }
      }
    }

    mediaInput.addEventListener('change', async (e) => {
      if (!directoryHandle) return;
      const files = e.target.files;
      for (let file of files) {
        const fileHandle = await directoryHandle.getFileHandle(file.name, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(file);
        await writable.close();
      }
      mediaInput.value = '';
      loadDeviceFolderFiles();
    });

    async function deleteDeviceFile(fileName) {
      if (!directoryHandle) return;
      await directoryHandle.removeEntry(fileName);
      loadDeviceFolderFiles();
    }

    const vaultApp = document.getElementById('vaultApp');
    const closeVaultAppBtn = document.getElementById('closeVaultAppBtn');
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxContainer = document.getElementById('lightboxContainer');
    const closeLightboxBtn = document.getElementById('closeLightboxBtn');

    closeVaultAppBtn.addEventListener('click', () => { vaultApp.style.display = 'none'; });

    // Acesso secreto: 12 toques rápidos no botão SAIR
    let clickCount = 0;
    let clickTimer = null;
    document.getElementById('secretExitBtn').addEventListener('click', () => {
      clickCount++;
      clearTimeout(clickTimer);
      if (clickCount >= 12) {
        vaultApp.style.display = 'flex';
        clickCount = 0;
      } else {
        clickTimer = setTimeout(() => { clickCount = 0; }, 400);
      }
    });

    function renderMediaCard(url, type, fileName) {
      let card = document.createElement('div');
      card.className = 'media-card';

      let mediaElem = type.startsWith('image/') ? document.createElement('img') : document.createElement('video');
      mediaElem.src = url;
      mediaElem.addEventListener('click', () => openLightbox(url, type));

      let delBtn = document.createElement('button');
      delBtn.className = 'delete-media';
      delBtn.innerHTML = '✕';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteDeviceFile(fileName);
      });

      card.appendChild(mediaElem);
      card.appendChild(delBtn);
      gallery.appendChild(card);
    }

    function openLightbox(url, type) {
      lightboxContainer.innerHTML = '';
      let elem = type.startsWith('image/') ? document.createElement('img') : document.createElement('video');
      elem.src = url;
      elem.style.maxWidth = '100%'; elem.style.maxHeight = '100%';
      if(type.startsWith('video/')) elem.controls = true;
      lightboxContainer.appendChild(elem);
      lightboxModal.style.display = 'flex';
    }

    closeLightboxBtn.addEventListener('click', () => {
      lightboxModal.style.display = 'none';
      lightboxContainer.innerHTML = '';
    });

    // --- MOTOR DO JOGO SPACE INVADERS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0, lives = 3, gameState = 'START';
    let player = { x: 140, y: 340, width: 24, height: 12, speed: 4, dx: 0 };
    let bullets = [], invaders = [];

    function initGame() {
      score = 0; lives = 3; bullets = []; player.x = 140; invaders = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          invaders.push({ x: 30 + c * 32, y: 50 + r * 24, width: 18, height: 12, alive: true, type: r });
        }
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
      if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
      if (e.key === ' ' || e.key === 'z') fireBullet();
      if (gameState === 'START' && (e.key === ' ' || e.key === 'Enter')) { gameState = 'PLAYING'; initGame(); }
    });
    window.addEventListener('keyup', e => {
      if ((e.key === 'ArrowLeft' || e.key === 'a') && player.dx < 0) player.dx = 0;
      if ((e.key === 'ArrowRight' || e.key === 'd') && player.dx > 0) player.dx = 0;
    });

    document.getElementById('leftBtn').addEventListener('touchstart', () => { player.dx = -player.speed; });
    document.getElementById('leftBtn').addEventListener('touchend', () => { if(player.dx < 0) player.dx = 0; });
    document.getElementById('rightBtn').addEventListener('touchstart', () => { player.dx = player.speed; });
    document.getElementById('rightBtn').addEventListener('touchend', () => { if(player.dx > 0) player.dx = 0; });
    document.getElementById('fireBtn').addEventListener('touchstart', (e) => { 
      e.preventDefault();
      if (gameState === 'PLAYING') fireBullet(); 
      else { gameState = 'PLAYING'; initGame(); }
    });

    function fireBullet() {
      if (bullets.length < 3) bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, dy: -6 });
    }

    let invaderTimer = 0, invaderDir = 1;
    function update() {
      if (gameState !== 'PLAYING') return;
      player.x += player.dx;
      if (player.x < 10) player.x = 10;
      if (player.x > canvas.width - player.width - 10) player.x = canvas.width - player.width - 10;

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i]; b.y += b.dy;
        if (b.y < 0) { bullets.splice(i, 1); continue; }
        for (let inv of invaders) {
          if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
            inv.alive = false; score += 10; bullets.splice(i, 1); break;
          }
        }
      }

      invaderTimer++;
      if (invaderTimer > 30) {
        invaderTimer = 0; let hitEdge = false;
        for (let inv of invaders) {
          if (!inv.alive) continue;
          inv.x += invaderDir * 8;
          if (inv.x <= 10 || inv.x >= canvas.width - 25) hitEdge = true;
          if (inv.y >= player.y - 15) gameState = 'GAMEOVER';
        }
        if (hitEdge) { invaderDir *= -1; for (let inv of invaders) inv.y += 10; }
      }
      if (invaders.every(inv => !inv.alive)) gameState = 'START';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (gameState === 'START') {
        ctx.fillStyle = '#00ffcc'; ctx.font = '14px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('TOQUE EM FIRE OU ENTER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#ffcc00'; ctx.fillText('PARA JOGAR', canvas.width / 2, canvas.height / 2 + 10);
        return;
      }
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#ff3333'; ctx.font = '18px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 10);
        return;
      }

      ctx.fillStyle = '#00ff00'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 15, 20);
      ctx.fillText(`LIVES: ${lives}`, canvas.width - 70, 20);

      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillRect(player.x + 8, player.y - 4, 8, 4);

      for (let inv of invaders) {
        if (!inv.alive) continue;
        ctx.fillStyle = inv.type === 0 ? '#ff3333' : inv.type === 1 ? '#00ffff' : '#ff33ff';
        ctx.fillRect(inv.x, inv.y, inv.width, inv.height);
      }

      ctx.fillStyle = '#ffffff';
      for (let b of bullets) ctx.fillRect(b.x, b.y, 3, 8);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
